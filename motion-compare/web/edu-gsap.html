<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #0B1020; overflow: hidden; font-family: sans-serif; }
      svg { display: block; }
    </style>
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
  </head>
  <body>
    <!-- Identical educational scenario (Pythagorean theorem) - GSAP + SVG -->
    <svg id="stage" viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
      <rect width="1280" height="720" fill="#0B1020"/>

      <polygon id="sq-a" class="sq" points="440,350 560,350 560,470 440,470" fill="#4CC9F0" fill-opacity="0.22" stroke="#4CC9F0" stroke-width="3" opacity="0"/>
      <polygon id="sq-b" class="sq" points="560,470 720,470 720,630 560,630" fill="#F72585" fill-opacity="0.22" stroke="#F72585" stroke-width="3" opacity="0"/>
      <polygon id="sq-c" class="sq" points="560,350 720,470 840,310 680,190" fill="#06D6A0" fill-opacity="0.22" stroke="#06D6A0" stroke-width="3" opacity="0"/>

      <line id="edge-a" x1="560" y1="470" x2="560" y2="350" stroke="#FFD166" stroke-width="5" stroke-linecap="round"/>
      <line id="edge-b" x1="560" y1="470" x2="720" y2="470" stroke="#FFD166" stroke-width="5" stroke-linecap="round"/>
      <line id="edge-c" x1="560" y1="350" x2="720" y2="470" stroke="#FFD166" stroke-width="5" stroke-linecap="round"/>
      <polygon id="ra" points="560,470 560,446 584,446 584,470" fill="none" stroke="#FFD166" stroke-width="3" opacity="0"/>

      <g font-weight="700" text-anchor="middle">
        <text id="lab-a" x="578" y="421" font-size="30" fill="#4CC9F0" opacity="0">a</text>
        <text id="lab-b" x="646" y="459" font-size="30" fill="#F72585" opacity="0">b</text>
        <text id="lab-c" x="618" y="415" font-size="30" fill="#06D6A0" opacity="0">c</text>

        <text id="area-a" x="500" y="422" font-size="34" fill="#4CC9F0" opacity="0">a&#178;</text>
        <text id="area-b" x="640" y="562" font-size="34" fill="#F72585" opacity="0">b&#178;</text>
        <text id="area-c" x="700" y="342" font-size="34" fill="#06D6A0" opacity="0">c&#178;</text>

        <text id="eq-a" x="566" y="700" font-size="52" fill="#4CC9F0" opacity="0">a&#178;</text>
        <text id="eq-p" x="616" y="700" font-size="52" fill="#E6EDF3" opacity="0">+</text>
        <text id="eq-b" x="666" y="700" font-size="52" fill="#F72585" opacity="0">b&#178;</text>
        <text id="eq-e" x="716" y="700" font-size="52" fill="#E6EDF3" opacity="0">=</text>
        <text id="eq-c" x="766" y="700" font-size="52" fill="#06D6A0" opacity="0">c&#178;</text>
      </g>

      <text id="title" x="640" y="60" font-size="58" font-weight="800" fill="#E6EDF3" text-anchor="middle" opacity="0">Pythagorean Theorem</text>
      <text id="subtitle" x="640" y="110" font-size="24" fill="#9FB3C8" text-anchor="middle" opacity="0">A right triangle with legs a, b and hypotenuse c</text>
    </svg>

    <script>
      const len = (id) => { const e = document.getElementById(id); return Math.hypot(+e.getAttribute('x2') - +e.getAttribute('x1'), +e.getAttribute('y2') - +e.getAttribute('y1')); };
      ['edge-a','edge-b','edge-c'].forEach((id) => {
        const e = document.getElementById(id);
        const L = len(id);
        e.style.strokeDasharray = L;
        e.style.strokeDashoffset = L;
      });
      gsap.set('#sq-a', { svgOrigin: '500 410', scale: 0.7 });
      gsap.set('#sq-b', { svgOrigin: '640 550', scale: 0.7 });
      gsap.set('#sq-c', { svgOrigin: '700 330', scale: 0.7 });

      const tl = gsap.timeline({ paused: true });

      // 0.0 title
      tl.to('#title', { opacity: 1, y: 6, duration: 1.2, ease: 'power3.out' }, 0);
      // 1.2 subtitle
      tl.to('#subtitle', { opacity: 1, duration: 0.6 }, 1.2);
      // 1.8 triangle draw
      tl.to('#edge-a', { strokeDashoffset: 0, duration: 1.0, ease: 'power2.out' }, 1.8);
      tl.to('#edge-b', { strokeDashoffset: 0, duration: 1.0, ease: 'power2.out' }, 2.1);
      tl.to('#edge-c', { strokeDashoffset: 0, duration: 1.0, ease: 'power2.out' }, 2.4);
      // 3.4 right angle marker + 3.8 labels
      tl.to('#ra', { opacity: 1, duration: 0.4 }, 3.4);
      tl.to(['#lab-a', '#lab-b', '#lab-c'], { opacity: 1, duration: 0.5, stagger: 0.1 }, 3.8);
      // 4.3 squares grow
      tl.to('#sq-a', { opacity: 1, scale: 1, duration: 1.0, ease: 'power2.out' }, 4.3);
      tl.to('#sq-b', { opacity: 1, scale: 1, duration: 1.0, ease: 'power2.out' }, 4.5);
      tl.to('#sq-c', { opacity: 1, scale: 1, duration: 1.1, ease: 'power2.out' }, 4.7);
      // 5.8 area labels
      tl.to(['#area-a', '#area-b', '#area-c'], { opacity: 1, duration: 0.7, stagger: 0.1 }, 5.8);
      // 6.5 equation
      tl.to(['#eq-a','#eq-p','#eq-b','#eq-e','#eq-c'], { opacity: 1, duration: 0.8, stagger: 0.05 }, 6.5);
      // 7.5 pulse c²
      tl.to('#sq-c', { scale: 1.06, duration: 0.4, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 7.5);
      // pad to 10 s
      tl.to({}, { duration: 10 }, 0);
      tl.time(0);

      window.renderFrame = (i) => { tl.time(i / 30); };
      tl.time(0);
      window.__ready = true;
    </script>
  </body>
</html>
