<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #0B1020; overflow: hidden; font-family: sans-serif; }
      #lottie { position: absolute; inset: 0; }
      #labels { position: absolute; inset: 0; pointer-events: none; }
      .lbl { position: absolute; transform: translate(-50%, -50%); font-weight: 700; white-space: nowrap; opacity: 0; }
    </style>
    <script src="node_modules/lottie-web/build/player/lottie.min.js"></script>
  </head>
  <body>
    <!--
      Identical educational scenario - Lottie.
      LIMITATION: lottie-web is a *playback* format for After Effects exports, not
      an authoring-from-code engine. Here the geometry is real Lottie shape data
      (built in JS) but the text is rendered by a DOM overlay because Lottie text
      layers need bundled fonts. Also, layer *scale* keyframes do not render in
      this headless build, so growth is done with shape-size keyframes instead.
    -->
    <div id="lottie"></div>
    <div id="labels"></div>
    <script>
      const E = { i: { x: [0.42], y: [1] }, o: { x: [0.58], y: [0] } };
      const kf = (pairs) => ({ a: 1, k: pairs.map((p, idx) => idx === pairs.length - 1 ? { t: p[0], s: p[1] } : Object.assign({ t: p[0], s: p[1] }, E)) });
      const tr = (o = 100) => ({ ty: "tr", p: { a: 0, k: [0, 0] }, a: { a: 0, k: [0, 0] }, s: { a: 0, k: [100, 100] }, r: { a: 0, k: 0 }, o: { a: 0, k: o }, sk: { a: 0, k: 0 }, sa: { a: 0, k: 0 } });
      const rgba = (r, g, b) => [r, g, b, 1];

      const squareLayer = (ind, cx, cy, col, from, size, rot = 0) => ({
        ddd: 0, ind, ty: 4, nm: "sq", sr: 1,
        ks: {
          o: kf([[from[0], [0]], [from[1], [100]]]),
          r: { a: 0, k: rot },
          p: { a: 0, k: [cx, cy, 0] },
          a: { a: 0, k: [0, 0, 0] },
          s: { a: 0, k: [100, 100, 100] },
        },
        ao: 0,
        shapes: [{
          ty: "gr", nm: "g", it: [
            { ty: "rc", d: 1, s: kf([[from[0], [size * 0.7, size * 0.7]], [from[1], [size, size]]]), p: { a: 0, k: [0, 0] }, r: { a: 0, k: 0 }, nm: "r" },
            { ty: "fl", c: { a: 0, k: rgba(...col) }, o: { a: 0, k: 22 }, r: 1, nm: "f" },
            { ty: "st", c: { a: 0, k: rgba(...col) }, o: { a: 0, k: 100 }, w: { a: 0, k: 3 }, lc: 2, lj: 2, nm: "s" },
            tr(),
          ],
        }],
        ip: 0, op: 300, st: 0, bm: 0,
      });

      const pathLayer = (ind, verts, col, from, width, closed) => ({
        ddd: 0, ind, ty: 4, nm: "path", sr: 1,
        ks: { o: kf([[from[0], [0]], [from[1], [100]]]), r: { a: 0, k: 0 }, p: { a: 0, k: [0, 0, 0] }, a: { a: 0, k: [0, 0, 0] }, s: { a: 0, k: [100, 100, 100] } },
        ao: 0,
        shapes: [{
          ty: "gr", nm: "g", it: [
            { ty: "sh", ks: { a: 0, k: { i: verts.map(() => [0, 0]), o: verts.map(() => [0, 0]), v: verts, c: closed } }, nm: "p" },
            { ty: "st", c: { a: 0, k: rgba(...col) }, o: { a: 0, k: 100 }, w: { a: 0, k: width }, lc: 2, lj: 2, nm: "s" },
            tr(),
          ],
        }],
        ip: 0, op: 300, st: 0, bm: 0,
      });

      const BLUE = [0.298, 0.788, 0.941], PINK = [0.969, 0.145, 0.522], GREEN = [0.024, 0.839, 0.627], YELLOW = [1, 0.82, 0.4];

      const animData = {
        v: "5.7.4", fr: 30, ip: 0, op: 300, w: 1280, h: 720, nm: "edu", ddd: 0, assets: [],
        layers: [
          squareLayer(1, 500, 410, BLUE, [129, 159], 120),
          squareLayer(2, 640, 550, PINK, [135, 165], 160),
          squareLayer(3, 700, 330, GREEN, [141, 174], 200, 36.87),
          pathLayer(4, [[560, 350], [720, 470], [560, 470]], YELLOW, [54, 102], 5, true),
          pathLayer(5, [[560, 470], [560, 446], [584, 446], [584, 470]], YELLOW, [102, 114], 3, false),
        ],
      };

      const anim = lottie.loadAnimation({
        container: document.getElementById("lottie"),
        renderer: "canvas", loop: false, autoplay: false, animationData: animData,
      });

      // ---- text overlay (same content + timings as the other engines)
      const labels = [
        ['a', 578, 404, 30, '#4CC9F0', 'lab'], ['b', 646, 442, 30, '#F72585', 'lab'], ['c', 618, 398, 30, '#06D6A0', 'lab'],
        ['a\u00b2', 500, 404, 34, '#4CC9F0', 'area'], ['b\u00b2', 640, 544, 34, '#F72585', 'area'], ['c\u00b2', 700, 324, 34, '#06D6A0', 'area'],
        ['a\u00b2', 566, 678, 52, '#4CC9F0', 'eq'], ['+', 616, 678, 52, '#E6EDF3', 'eq'], ['b\u00b2', 666, 678, 52, '#F72585', 'eq'],
        ['=', 716, 678, 52, '#E6EDF3', 'eq'], ['c\u00b2', 766, 678, 52, '#06D6A0', 'eq'],
        ['Pythagorean Theorem', 640, 52, 58, '#E6EDF3', 'title'],
        ['A right triangle with legs a, b and hypotenuse c', 640, 104, 24, '#9FB3C8', 'sub'],
      ];
      const host = document.getElementById('labels');
      const nodes = labels.map(([t, x, y, size, col, kind]) => {
        const d = document.createElement('div');
        d.className = 'lbl'; d.textContent = t;
        d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.fontSize = size + 'px'; d.style.color = col;
        if (kind === 'title') d.style.fontWeight = '800';
        host.appendChild(d);
        return { d, kind };
      });
      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const seg = (f, a, b) => clamp01((f - a) / (b - a));
      const lerp = (a, b, t) => a + (b - a) * t;
      const setKind = (kind, o, dy = 0) => nodes.forEach(n => {
        if (n.kind === kind) { n.d.style.opacity = String(o); n.d.style.transform = `translate(-50%, calc(-50% + ${dy}px))`; }
      });

      window.renderFrame = (i) => {
        anim.goToAndStop(i, true);
        setKind('lab', seg(i,114,129));
        setKind('area', seg(i,174,195));
        setKind('eq', seg(i,195,225), lerp(20, 0, seg(i,195,225)));
        setKind('title', seg(i,0,36), lerp(-14, 0, seg(i,0,36)));
        setKind('sub', seg(i,36,54));
      };
      window.renderFrame(0);
      window.__ready = true;
    </script>
  </body>
</html>
