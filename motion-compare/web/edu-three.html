<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #0B1020; overflow: hidden; font-family: sans-serif; }
      #labels { position: absolute; inset: 0; pointer-events: none; }
      .lbl { position: absolute; transform: translate(-50%, -50%); font-weight: 700; white-space: nowrap; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="labels"></div>
    <script type="module">
      import * as THREE from "./node_modules/three/build/three.module.js";

      // Identical educational scenario (Pythagorean theorem) - three.js.
      const W = 1280, H = 720;
      const BG = 0x0b1020, COL_A = 0x4cc9f0, COL_B = 0xf72585, COL_C = 0x06d6a0, TRI = 0xffd166;
      const A = { x: 560, y: 350 }, B = { x: 720, y: 470 }, C = { x: 560, y: 470 };

      // screen px -> world (camera is centred, y up)
      const pt = (px, py) => new THREE.Vector3(px - W / 2, H / 2 - py, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(W, H);
      renderer.setClearColor(BG, 1);
      document.body.appendChild(renderer.domElement);

      const camera = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, 0.1, 1000);
      camera.position.z = 10;
      const scene = new THREE.Scene();

      const mkSquare = (cx, cy, size, color, rot) => {
        const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0 });
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(size, size), mat);
        mesh.position.copy(pt(cx, cy));
        mesh.rotation.z = rot;
        mesh.scale.setScalar(0.7);
        scene.add(mesh);
        const edge = new THREE.LineLoop(
          new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(-size / 2, -size / 2, 0), new THREE.Vector3(size / 2, -size / 2, 0),
            new THREE.Vector3(size / 2, size / 2, 0), new THREE.Vector3(-size / 2, size / 2, 0),
          ]),
          new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0 }),
        );
        edge.position.z = 0.1;
        mesh.add(edge);
        return { mesh, mat, edge };
      };

      const sqA = mkSquare(500, 410, 120, COL_A, 0);
      const sqB = mkSquare(640, 550, 160, COL_B, 0);
      const sqC = mkSquare(700, 330, 200, COL_C, -Math.atan2(120, 160));

      const mkEdge = (p, q) => {
        const g = new THREE.BufferGeometry().setFromPoints([pt(p.x, p.y), pt(p.x, p.y)]);
        const line = new THREE.Line(g, new THREE.LineBasicMaterial({ color: TRI }));
        line.position.z = 0.2;
        scene.add(line);
        return { line, p: pt(p.x, p.y), q: pt(q.x, q.y) };
      };
      const edges = [mkEdge(C, A), mkEdge(C, B), mkEdge(A, B)];

      const raPts = [ {x:560,y:470},{x:560,y:446},{x:584,y:446},{x:584,y:470} ].map(p => pt(p.x, p.y));
      const rightAngle = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(raPts),
        new THREE.LineBasicMaterial({ color: TRI, transparent: true, opacity: 0 }),
      );
      rightAngle.position.z = 0.2;
      scene.add(rightAngle);

      // text overlay (pixel coordinates)
      const labels = [
        ['a', 578, 404, 30, '#4CC9F0', 'lab'], ['b', 646, 442, 30, '#F72585', 'lab'], ['c', 618, 398, 30, '#06D6A0', 'lab'],
        ['a\u00b2', 500, 404, 34, '#4CC9F0', 'area'], ['b\u00b2', 640, 544, 34, '#F72585', 'area'], ['c\u00b2', 700, 324, 34, '#06D6A0', 'area'],
        ['a\u00b2', 566, 678, 52, '#4CC9F0', 'eq'], ['+', 616, 678, 52, '#E6EDF3', 'eq'], ['b\u00b2', 666, 678, 52, '#F72585', 'eq'],
        ['=', 716, 678, 52, '#E6EDF3', 'eq'], ['c\u00b2', 766, 678, 52, '#06D6A0', 'eq'],
        ['Pythagorean Theorem', 640, 52, 58, '#E6EDF3', 'title'],
        ['A right triangle with legs a, b and hypotenuse c', 640, 104, 24, '#9FB3C8', 'sub'],
      ];
      const host = document.getElementById('labels');
      const nodes = labels.map(([t, x, y, size, col, kind]) => {
        const d = document.createElement('div');
        d.className = 'lbl'; d.textContent = t;
        d.style.left = x + 'px'; d.style.top = y + 'px';
        d.style.fontSize = size + 'px'; d.style.color = col;
        if (kind === 'title') d.style.fontWeight = '800';
        host.appendChild(d);
        return { d, kind };
      });
      const setKind = (kind, o, dy = 0) => nodes.forEach(n => {
        if (n.kind === kind) { n.d.style.opacity = String(o); n.d.style.transform = `translate(-50%, calc(-50% + ${dy}px))`; }
      });

      const clamp01 = (x) => Math.max(0, Math.min(1, x));
      const seg = (f, a, b) => clamp01((f - a) / (b - a));
      const lerp = (a, b, t) => a + (b - a) * t;

      window.__ready = true;
      window.renderFrame = (i) => {
        sqA.mat.opacity = 0.22 * seg(i,129,159); sqA.edge.material.opacity = seg(i,129,159); sqA.mesh.scale.setScalar(lerp(0.7,1,seg(i,129,159)));
        sqB.mat.opacity = 0.22 * seg(i,135,165); sqB.edge.material.opacity = seg(i,135,165); sqB.mesh.scale.setScalar(lerp(0.7,1,seg(i,135,165)));
        const pulse = 1 + 0.06 * Math.sin(Math.PI * seg(i,225,249));
        sqC.mat.opacity = 0.22 * seg(i,141,174); sqC.edge.material.opacity = seg(i,141,174); sqC.mesh.scale.setScalar(lerp(0.7,1,seg(i,141,174)) * pulse);

        const ts = [seg(i,54,84), seg(i,63,93), seg(i,72,102)];
        edges.forEach((e, k) => {
          const t = ts[k];
          const pos = e.line.geometry.attributes.position;
          pos.setXYZ(1, lerp(e.p.x, e.q.x, t), lerp(e.p.y, e.q.y, t), 0);
          pos.needsUpdate = true;
        });
        rightAngle.material.opacity = seg(i,102,114);

        setKind('lab', seg(i,114,129));
        setKind('area', seg(i,174,195));
        setKind('eq', seg(i,195,225), lerp(20, 0, seg(i,195,225)));
        setKind('title', seg(i,0,36), lerp(-14, 0, seg(i,0,36)));
        setKind('sub', seg(i,36,54));

        renderer.render(scene, camera);
      };
      window.renderFrame(0);
    </script>
  </body>
</html>
