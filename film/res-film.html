<!doctype html>
<html lang="fa" dir="rtl">
<meta charset="utf-8">
<title>دستگاه رتیکولو اندوتلیال — انیمیشن آموزشی</title>
<style>
  @font-face{font-family:'Vazir';src:url('fonts/Vazirmatn-Regular.ttf') format('truetype');font-display:block}
  @font-face{font-family:'VazirM';src:url('fonts/Vazirmatn-Medium.ttf') format('truetype');font-display:block}
  @font-face{font-family:'VazirB';src:url('fonts/Vazirmatn-Bold.ttf') format('truetype');font-display:block}
  @font-face{font-family:'Lalezar';src:url('fonts/Lalezar-Regular.ttf') format('truetype');font-display:block}
  html,body{margin:0;background:#242321;display:grid;place-items:center;min-height:100vh}
  canvas{max-width:100vw;max-height:100vh;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.5)}
</style>
<canvas id="c"></canvas>
<script src="./durations.js"></script>
<script src="./core.js"></script>
<script src="./studio.js"></script>
<script>
'use strict';
// ============================================================================
// دستگاه رتیکولو اندوتلیال — a hand-drawn explainer film.
// Narration: Google Gemini TTS, voice "Aoede" (Persian, colloquial).
// Everything is drawn procedurally: paper, brush strokes, watercolour washes.
// ============================================================================
document.fonts.load('40px Vazir'); document.fonts.load('40px VazirM');
document.fonts.load('40px VazirB'); document.fonts.load('40px Lalezar');

const PAPER = '#f7f2e7';
const INK = '#22303f';
const RED = '#bf4a34';
const BLUE = '#3a72a8';
const GOLD = '#d99b2b';
const GREEN = '#4f8f63';
const VIOLET = '#7d5aa0';
const ROSE = '#c9738a';

const FILMPAL = makePalette({
  paper: PAPER, ink: INK, shade: '#5a6a7d', light: '#fdfaf2',
  night: '#1b2432', chalk: '#f3ebd9', chalkDim: '#a9b8c9',
  blush: '#e6a08c', guide: '#a8b4c2',
  fills: ['#e9cda6', '#f0dcc8', '#d7e3ee', '#cfe0d2'],
  accents: [RED, GOLD, BLUE, GREEN, VIOLET],
  finish: 'ink'
}, 'paperInk');

// ---------- Persian lettering ----------
const FONT = { body: 'Vazir', med: 'VazirM', bold: 'VazirB', disp: 'Lalezar' };
function fa(c, text, x, y, o = {}) {
  const { size = 34, font = FONT.med, color = PAL.ink, align = 'center', baseline = 'middle', alpha: al = 1, lift = 0 } = o;
  c.save(); c.direction = 'rtl'; c.textAlign = align; c.textBaseline = baseline;
  c.font = `${size}px ${font}`; c.fillStyle = color; c.globalAlpha = al;
  if (lift) { c.fillStyle = alpha(color, .22); c.fillText(text, x + lift * .7, y + lift); c.fillStyle = color; }
  c.fillText(text, x, y); c.restore();
}
function faShadow(c, text, x, y, o = {}) { return fa(c, text, x, y, { ...o, lift: o.lift ?? 2.5 }); }
// a hand-drawn underline under a label
function faUnderline(c, text, x, y, o = {}) {
  const { size = 34, font = FONT.med, color = PAL.ink, pen = PAL.accents[0], seed = 3, p = 1, gap = 16 } = o;
  c.save(); c.direction = 'rtl'; c.font = `${size}px ${font}`;
  const w = c.measureText(text).width; c.restore();
  fa(c, text, x, y, { size, font, color });
  const y2 = y + size * .72, hw = w / 2 + gap;
  brush(c, [[x + hw, y2], [x + hw * .3, y2 + 4], [x - hw * .3, y2 - 3], [x - hw, y2 + 2]], { w: size * .12, color: pen, p, seed, amp: 2.2 });
  return w;
}
// numbered / bulleted hand-drawn caption
function caption(c, text, x, y, o = {}) {
  const { size = 32, color = PAL.ink, bg = PAL.light, box = true, seed = 7, p = 1, font = FONT.med, pad = 22, align = 'center' } = o;
  c.save(); c.direction = 'rtl'; c.font = `${size}px ${font}`;
  const w = c.measureText(text).width; c.restore();
  const h = size * 1.85, x0 = x - w / 2 - pad, y0 = y - h / 2;
  if (box && p > .02) {
    const P = roundRectPath(x0, y0, w + pad * 2, h, 14);
    c.save(); c.globalAlpha = .92 * Math.min(1, p * 1.4); c.fillStyle = bg; c.fill(P); c.restore();
    brush(c, [[x0, y0 + 4], [x0 + (w + pad * 2) * .5, y0], [x0 + w + pad * 2, y0 + 3], [x0 + w + pad * 2 - 2, y0 + h - 2], [x0 + (w + pad * 2) * .4, y0 + h], [x0, y0 + h - 3]], { w: 2.6, color: alpha(PAL.ink, .55), p, seed, close: true, amp: 1.4 });
  }
  fa(c, text, x, y + size * .06, { size, font, color, alpha: Math.min(1, Math.max(0, (p - .25) / .5)) });
}
// ============================================================================

// ===================== PRIMITIVES =====================
// Every scene starts here: paper, a soft vignette and a thin drawn border.
function paperShot(c, seed = 5, o = {}) {
  paper(c, PAPER, null, seed);
  const { vignette = .18, border = true } = o;
  c.save(); resetT(c);
  const g = c.createRadialGradient(CX, CY, H * .25, CX, CY, Math.hypot(W, H) * .58);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(70,58,40,${vignette})`);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  if (border) { c.strokeStyle = alpha(INK, .18); c.lineWidth = 2; c.strokeRect(16, 16, W - 32, H - 32); }
  c.restore();
}
// the film's name, small, in the corner, plus a drawn progress line
function cornerMark(c, i2) {
  const t = clamp((i2 / 12) / TOTAL, 0, 1);
  c.save(); resetT(c); c.direction = 'rtl'; c.textAlign = 'right'; c.textBaseline = 'middle';
  c.font = `26px ${FONT.med}`; c.fillStyle = alpha(INK, .45);
  c.fillText('دستگاه رتیکولو اندوتلیال', W - 54, 52); c.restore();
  c.save(); resetT(c);
  brush(c, [[54, H - 44], [54 + (W - 108) * .5, H - 45], [W - 54, H - 44]], { w: 3, color: alpha(INK, .18), amp: 1, seed: 21 });
  brush(c, [[54, H - 44], [54 + (W - 108) * t, H - 44.5]], { w: 5, color: alpha(RED, .75), amp: 1.2, seed: 22 });
  c.restore();
}
// --- cells -------------------------------------------------------------
function blobPath(x, y, rx, ry, seed, o = {}) { return curvePath(blob(x, y, rx, ry, seed, { amp: o.amp ?? .07, rot: o.rot ?? 0, n: o.n ?? 56 }), true); }
function macrophagePath(x, y, s, seed, o = {}) {
  const { squash = 1, amp = .15, lobes = 0 } = o;
  const base = blob(x, y, s, s * squash, seed, { amp, n: 64 });
  if (!lobes) return curvePath(base, true);
  const r = rng(seed + 7), k = [];
  for (let i = 0; i < lobes; i++) k.push([r() * TAU, .5 + r() * .55]);
  return curvePath(base.map(([px, py]) => {
    const a = Math.atan2(py - y, px - x), d = Math.hypot(px - x, py - y);
    let m = 1; for (const [ka, kw] of k) { const dd = Math.abs(((a - ka + Math.PI * 3) % TAU) - Math.PI); m += kw * Math.exp(-Math.pow(dd / .42, 2)); }
    return [x + Math.cos(a) * d * m, y + Math.sin(a) * d * m];
  }), true);
}
// A macrophage: watercolour body, brush outline revealed around the rim, kidney nucleus.
function macrophage(c, x, y, s, o = {}) {
  const { seed = 11, color = VIOLET, p = 1, al = .42, nucleus = true, lobes = 3, squash = 1, ink = INK, w = 3.2, vacuoles = 0, boilSeed = 0, face = false } = o;
  if (p <= .02) return;
  const path = macrophagePath(x, y, s, seed, { squash, amp: .15, lobes });
  wash(c, path, color, { al: al * Math.min(1, p * 1.2), seed: seed + 3, off: 4 });
  const ring = blob(x, y, s, s * squash, seed, { amp: .15, n: 64 });
  const n = ring.length, start = Math.floor(n * .5), upto = Math.max(2, Math.round(n * clamp(p, 0, 1)));
  const arc = []; for (let k = 0; k < upto; k++) arc.push(ring[(start + k) % n]);
  brush(c, arc, { w, color: ink, seed: seed + boilSeed, amp: 1.6 });
  if (nucleus) {
    const np = blobPath(x - s * .18, y + s * .08, s * .34, s * .26, seed + 5, { amp: .22 });
    wash(c, np, PAL.accents[4], { al: .5, seed: seed + 9, off: 3 });
    c.save(); c.strokeStyle = alpha(ink, .75); c.lineWidth = 2.2; c.stroke(np); c.restore();
  }
  if (vacuoles) { const r = rng(seed + 13); for (let k = 0; k < vacuoles; k++) { const a = r() * TAU, d = r() * s * .5; c.save(); c.strokeStyle = alpha(ink, .5); c.lineWidth = 1.6; c.beginPath(); c.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, s * (.10 + r() * .07), 0, TAU); c.stroke(); c.restore(); } }
  if (face) { c.save(); c.fillStyle = alpha(ink, .8); c.beginPath(); c.arc(x + s * .22, y - s * .18, 3.4, 0, TAU); c.arc(x + s * .46, y - s * .16, 3.4, 0, TAU); c.fill(); c.restore(); }
}
function rbc(c, x, y, s, rot = 0, o = {}) {
  const { color = RED, p = 1, aged = 0, ink = INK, seed = 2 } = o;
  const path = ellPath(x, y, s, s * .66, rot);
  wash(c, path, aged ? mix(color, '#6b5a3a', aged * .8) : color, { al: .55, seed: seed + 1, off: 3 });
  c.save(); c.globalAlpha = p; c.strokeStyle = alpha(ink, .55); c.lineWidth = 2; c.stroke(path);
  c.beginPath(); c.ellipse(x - Math.cos(rot) * s * .18, y - Math.sin(rot) * s * .18, s * .42, s * .26, rot, 0, TAU);
  c.fillStyle = alpha(ink, .18); c.fill(); c.restore();
}
function bacterium(c, x, y, s, rot = 0, o = {}) {
  const { color = GREEN, p = 1, ink = INK, flagella = 3, seed = 4, opsonin = 0 } = o;
  c.save(); c.translate(x, y); c.rotate(rot); c.translate(-x, -y);
  const path = roundRectPath(x - s, y - s * .55, s * 2, s * 1.1, s * .5);
  wash(c, path, color, { al: .5, seed: seed + 2, off: 3 });
  c.save(); c.globalAlpha = p; c.strokeStyle = alpha(ink, .7); c.lineWidth = 2.4; c.stroke(path); c.restore();
  for (let k = 0; k < flagella; k++) {
    const a = (k - (flagella - 1) / 2) * .5, x0 = x - s * Math.cos(a), y0 = y - s * .5 * Math.sin(a) - s * .3;
    brush(c, [[x0, y0], [x0 - s * .7, y0 + s * .4 * (k % 2 ? 1 : -1)], [x0 - s * 1.3, y0 + s * .15]], { w: 1.6, color: alpha(ink, .5), p, seed: seed + 20 + k, amp: 3 });
  }
  c.restore();
  if (opsonin > 0) for (let k = 0; k < 3; k++) antibody(c, x + (k - 1) * s * .75, y - s * .95, s * .42, k * .3 - .3, { p: opsonin, color: GOLD, seed: 30 + k });
}
function virus(c, x, y, s, rot = 0, o = {}) {
  const { color = ROSE, p = 1, ink = INK, seed = 6 } = o;
  c.save();
  for (let k = 0; k < 11; k++) { const a = k / 11 * TAU + rot; brush(c, [[x + Math.cos(a) * s * .95, y + Math.sin(a) * s * .95], [x + Math.cos(a) * s * 1.5, y + Math.sin(a) * s * 1.5]], { w: 2.4, color: alpha(ink, .6), p, seed: seed + k, amp: 1 }); }
  const path = blobPath(x, y, s, s, seed, { amp: .1 });
  wash(c, path, color, { al: .45, seed: seed + 4, off: 3 });
  c.globalAlpha = p; c.strokeStyle = alpha(ink, .7); c.lineWidth = 2.4; c.stroke(path); c.restore();
}
function antibody(c, x, y, s, rot = 0, o = {}) {
  const { p = 1, color = GOLD } = o;
  c.save(); c.translate(x, y); c.rotate(rot);
  brush(c, [[0, s * 1.1], [0, s * .25]], { w: s * .3, color, p, amp: 1, seed: 41 });
  brush(c, [[0, s * .25], [-s * .75, -s * .8]], { w: s * .28, color, p, amp: 1, seed: 42 });
  brush(c, [[0, s * .25], [s * .75, -s * .8]], { w: s * .28, color, p, amp: 1, seed: 43 });
  c.restore();
}
function lysosome(c, x, y, s, o = {}) {
  const { p = 1, seed = 8, color = GOLD, ink = INK, enzymes = 7 } = o;
  const path = blobPath(x, y, s, s * .92, seed, { amp: .12 });
  wash(c, path, color, { al: .4 * p, seed: seed + 2, off: 3 });
  c.save(); c.globalAlpha = p; c.strokeStyle = alpha(ink, .65); c.lineWidth = 2.2; c.stroke(path);
  const r = rng(seed + 3); c.fillStyle = alpha(ink, .55);
  for (let k = 0; k < enzymes; k++) { const a = r() * TAU, d = r() * s * .55; c.beginPath(); c.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, 2.6, 0, TAU); c.fill(); }
  c.restore();
}
function debris(c, x, y, s, seed, o = {}) {
  const { p = 1, color = '#8b8272' } = o; const r = rng(seed);
  c.save(); c.globalAlpha = p;
  for (let k = 0; k < 5; k++) { const a = r() * TAU, d = r() * s; c.fillStyle = alpha(color, .55 + r() * .3); c.beginPath(); c.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, s * (.12 + r() * .18), 0, TAU); c.fill(); }
  c.restore();
}

// a blood vessel running across the frame: two wavy walls, a faint wash inside
function vessel(c, y, o = {}) {
  const { amp = 34, color = RED, p = 1, seed = 12, half = 150, ink = INK } = o;
  const top = [], bot = [];
  for (let k = 0; k <= 24; k++) { const u = k / 24, x = -40 + u * (W + 80), yy = y + Math.sin(u * 3.1 + seed) * amp; top.push([x, yy - half]); bot.push([x, yy + half]); }
  const path = polyPath([...top, ...bot.slice().reverse()], true);
  c.save(); c.globalAlpha = .5; c.fillStyle = alpha(color, .12); c.fill(path); c.restore();
  brush(c, top, { w: 3.6, color: alpha(ink, .6), p, seed: seed + 1, amp: .5, taper: 0 });
  brush(c, bot, { w: 3.6, color: alpha(ink, .6), p, seed: seed + 2, amp: .5, taper: 0 });
  return path;
}
function arrow(c, a, b, o = {}) {
  const { p = 1, color = INK, w = 4, lift = 60, seed = 5, head = 1 } = o;
  const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - lift];
  const u = clamp(p, 0, 1), cur = [[a[0], a[1]], [lerp(a[0], mid[0], u), lerp(a[1], mid[1], u)], [lerp(a[0], b[0], u), lerp(a[1], b[1], u)]];
  brush(c, cur, { w, color, p: 1, seed, amp: 1.4 });
  if (p > .9 && head) {
    const tip = b, back = [lerp(mid[0], b[0], .8), lerp(mid[1], b[1], .8)];
    const ang = Math.atan2(tip[1] - back[1], tip[0] - back[0]);
    brush(c, [[tip[0], tip[1]], [tip[0] - Math.cos(ang - .5) * 26 * head, tip[1] - Math.sin(ang - .5) * 26 * head]], { w, color, seed: seed + 1, amp: 1 });
    brush(c, [[tip[0], tip[1]], [tip[0] - Math.cos(ang + .5) * 26 * head, tip[1] - Math.sin(ang + .5) * 26 * head]], { w, color, seed: seed + 2, amp: 1 });
  }
}
// a small hand-drawn tag with a pointer, for organ names
function tag(c, text, x, y, o = {}) {
  const { size = 30, color = PAL.ink, bg = PAL.light, pen = INK, seed = 9, p = 1, tail = null } = o;
  c.save(); c.direction = 'rtl'; c.font = `${size}px ${FONT.med}`;
  const w = c.measureText(text).width; c.restore();
  const h = size * 1.7, x0 = x - w / 2 - 16, y0 = y - h / 2;
  c.save(); c.globalAlpha = Math.min(1, p * 1.5); c.fillStyle = bg; c.fill(roundRectPath(x0, y0, w + 32, h, 10)); c.restore();
  brush(c, [[x0, y0 + 3], [x0 + (w + 32) * .55, y0], [x0 + w + 32, y0 + 3], [x0 + w + 30, y0 + h - 2], [x0 + (w + 32) * .45, y0 + h], [x0, y0 + h - 3]], { w: 2.4, color: alpha(pen, .6), p, close: true, seed, amp: 1.2 });
  if (tail) brush(c, [[x, y + (tail[1] > y ? h / 2 : -h / 2)], tail], { w: 2, color: alpha(pen, .5), p, seed: seed + 3, amp: 1 });
  fa(c, text, x, y + size * .06, { size, color, alpha: Math.min(1, Math.max(0, (p - .3) / .4)) });
}
// a tick drawn by hand, for checklists
function tick(c, x, y, s, p = 1, color = GREEN) {
  if (p <= 0) return;
  brush(c, [[x - s, y], [x - s * .2, y + s * .7], [x + s, y - s * .9]], { w: s * .32, color, p: clamp(p, 0, 1), seed: 61, amp: 1.2 });
}
function strike(c, x, y, w, p = 1, color = RED) {
  if (p <= 0) return;
  brush(c, [[x - w / 2, y + 4], [x, y - 6], [x + w / 2, y + 3]], { w: 6, color, p: clamp(p, 0, 1), seed: 62, amp: 2 });
}
// a soft pulse ring, for "here it is" moments
function pulseRing(c, x, y, r, p, color = RED, seed = 3) {
  if (p <= 0 || p >= 1) return;
  c.save(); c.globalAlpha = (1 - p) * .5; c.strokeStyle = color; c.lineWidth = 4 * (1 - p) + 1;
  c.beginPath(); c.arc(x, y, r * (.4 + p * 1.1), 0, TAU); c.stroke(); c.restore();
}


// --- organs: small iconic line drawings, drawn on with p -------------------
const ORGAN = {
  liver: { shape: [[-1, -.3], [-.72, -.66], [-.2, -.8], [.35, -.72], [.85, -.42], [1, .1], [.7, .5], [.1, .68], [-.5, .58], [-.9, .2]], inner: [[-.2, -.5], [.1, .1], [.5, .35]] },
  spleen: { shape: [[-.85, -.45], [-.35, -.78], [.35, -.6], [.9, .05], [.62, .62], [-.05, .78], [-.62, .45]] },
  brain: { shape: [[-1, -.1], [-.72, -.6], [-.2, -.78], [.3, -.7], [.85, -.4], [1, .1], [.7, .5], [.15, .72], [-.45, .6], [-.95, .25]], inner: [[-.45, -.35], [-.2, .15], [-.55, .45]], inner2: [[.1, -.45], [.35, .05], [.15, .45]] },
  marrow: { shape: [[-1, -.25], [-.75, -.5], [-.3, -.42], [.3, -.42], [.75, -.5], [1, -.2], [.9, .3], [.4, .5], [-.4, .5], [-.9, .3]], inner: [[-.3, -.35], [-.1, .1], [.25, .3]] },
  skin: { shape: [[-1, -.35], [1, -.35], [1, .35], [-1, .35]], inner: [[-1, .02], [1, .02]] },
  gut: { shape: [[-1, -.3], [-.5, -.55], [0, -.2], [.5, -.5], [1, -.25], [.9, .3], [.4, .5], [-.1, .25], [-.6, .55], [-1, .3]] },
};
function organ(c, kind, x, y, s, o = {}) {
  const { p = 1, seed = 17, color = RED, ink = INK, al = .45, label = null, dot = true, dotSeed = 3 } = o;
  const put = arr => arr.map(([a, b]) => [x + a * s, y + b * s]);
  const washShape = (shape, col, a2 = al) => { const path = curvePath(put(shape), true); wash(c, path, col, { al: a2, seed: seed + 2, off: 4 }); c.save(); c.strokeStyle = alpha(ink, .6); c.lineWidth = 2.6; c.stroke(path); c.restore(); };
  if (kind === 'lung') {
    washShape([[-.9, -.6], [-.55, -.75], [-.2, -.5], [-.15, .1], [-.35, .6], [-.75, .7], [-.95, .2]], color);
    washShape([[.9, -.6], [.55, -.75], [.2, -.5], [.15, .1], [.35, .6], [.75, .7], [.95, .2]], color);
    brush(c, put([[-.06, -.85], [-.04, .3]]), { w: 3, color: alpha(ink, .6), p, seed: seed + 1, amp: 1.4 });
    brush(c, put([[-.04, .3], [-.3, .5]]), { w: 2.6, color: alpha(ink, .6), p, seed: seed + 2, amp: 1.4 });
    brush(c, put([[-.04, .3], [.28, .5]]), { w: 2.6, color: alpha(ink, .6), p, seed: seed + 3, amp: 1.4 });
    const rr = rng(seed + 5); for (let k = 0; k < 6; k++) { c.save(); c.globalAlpha = p * .5; c.strokeStyle = alpha(ink, .55); c.lineWidth = 1.6; c.beginPath(); c.arc(x + (rr() * 1.5 - .75) * s, y + (rr() * 1.1 - .5) * s, s * .12, 0, TAU); c.stroke(); c.restore(); }
  } else if (kind === 'node') {
    washShape([[-.9, -.1], [-.5, -.6], [.2, -.62], [.85, -.15], [.55, .55], [-.25, .62], [-.85, .3]], color);
    brush(c, put([[-1.5, -.4], [-.85, -.2]]), { w: 3, color: alpha(ink, .55), p, seed: seed + 1, amp: 2 });
    brush(c, put([[-1.5, .35], [-.8, .3]]), { w: 3, color: alpha(ink, .55), p, seed: seed + 2, amp: 2 });
    brush(c, put([[.85, 0], [1.6, .25]]), { w: 3, color: alpha(ink, .55), p, seed: seed + 3, amp: 2 });
  } else {
    const spec = ORGAN[kind] || ORGAN.spleen;
    washShape(spec.shape, color);
    for (const k2 of ['inner', 'inner2']) if (spec[k2]) brush(c, put(spec[k2]), { w: 2.2, color: alpha(ink, .45), p, seed: seed + (k2 === 'inner' ? 4 : 5), amp: 2 });
  }
  if (dot) { const dp = clamp((p - .5) * 2, 0, 1); if (dp > 0) macrophage(c, x + s * .1, y - s * .05, s * .26, { seed: seed + dotSeed, color: VIOLET, p: dp, nucleus: false, lobes: 2, w: 2 }); }
  if (label) tag(c, label, x, y + s * 1.35, { size: 26, p: clamp((p - .6) * 2.5, 0, 1), seed: seed + 8 });
}

// ===================== SCENES =====================
const at = (tau, D) => clamp(tau / D, 0, 1);
const span = (tau, D, a, b) => sm(a * D, b * D, tau);
// a hand-drawn clock face; hands sweep once per `period`
function clockFace(c, x, y, r, t, o = {}) {
  const { color = INK, label = null } = o;
  c.save(); c.strokeStyle = alpha(color, .7); c.lineWidth = 3; c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke();
  for (let k = 0; k < 12; k++) { const a = k / 12 * TAU; c.beginPath(); c.moveTo(x + Math.cos(a) * r * .82, y + Math.sin(a) * r * .82); c.lineTo(x + Math.cos(a) * r * .95, y + Math.sin(a) * r * .95); c.stroke(); }
  const ha = t * TAU - Math.PI / 2, ma = t * TAU * 12 - Math.PI / 2;
  c.lineWidth = 4; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(ha) * r * .5, y + Math.sin(ha) * r * .5); c.stroke();
  c.lineWidth = 2.6; c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(ma) * r * .78, y + Math.sin(ma) * r * .78); c.stroke(); c.restore();
  if (label) fa(c, label, x, y + r + 26, { size: 26, color: alpha(color, .8) });
}

  c.beginPath(); c.moveTo(s * .6, 0); c.lineTo(s * 1.5, 0); c.stroke();
  c.beginPath(); c.moveTo(-s * .9, 0); c.lineTo(-s * 1.3, 0); c.moveTo(-s * 1.3, -s * .3); c.lineTo(-s * 1.3, s * .3); c.stroke();
  c.fillStyle = alpha(GOLD, .5); c.fillRect(-s * .85, -s * .22, s * .8, s * .44);
  c.restore();
}
